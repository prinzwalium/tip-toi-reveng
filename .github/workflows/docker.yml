name: "Docker image"

# Builds the container image that wraps tttool in a web GUI (see web/README.md),
# smoke tests it, and publishes it to the GitHub container registry for pushes
# to master and for tags.
#
# The image is built for linux/amd64 only: the default build compiles tttool
# with GHC, and doing that for arm64 under QEMU emulation takes hours. If you
# need an arm64 image, run the build on an arm64 machine (or an arm64 runner)
# with the same Dockerfile.

on:
  # Pushes to master and beta and release tags always publish, so that the
  # published image matches the branch even when only an example file changed.
  #
  #   master        -> :edge      (what is merged, may be rough)
  #   beta          -> :beta      (what you are asked to test)
  #   tag web-v*    -> :1.2.3, :1.2, :1, :latest
  #
  # Release tags are prefixed with "web-" so that they never collide with
  # tttool's own version tags in this repository.
  push:
    branches: [ master, beta ]
    tags: [ 'web-v*' ]
  # Pull requests only rebuild when something the image is made of changed.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'web/**'
      - 'src/**'
      - 'tttool.cabal'
      - 'cabal.project'
      - 'cabal.project.freeze'
      - 'example.yaml'
      - 'example/**'
      - 'text2speech*.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      tttool_source:
        description: "How the image gets its tttool binary"
        type: choice
        options: [ build, release ]
        default: build
      push:
        description: "Push the image to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tttool-web

jobs:
  web-tests:
    name: Web GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: web/requirements-dev.txt

      - run: pip install -r web/requirements-dev.txt

      # The suite runs against a stub tttool, so it needs no Haskell toolchain.
      - run: python -m pytest tests -q
        working-directory: web

      # A release tag must name the version the code actually reports.
      - name: Version matches the release tag
        if: startsWith(github.ref, 'refs/tags/web-v')
        run: |
          set -eux
          tagged="${GITHUB_REF_NAME#web-v}"
          declared=$(python -c "import sys; sys.path.insert(0, 'web'); import tttool_web; print(tttool_web.__version__)")
          test "$tagged" = "$declared" \
            || { echo "tag $GITHUB_REF_NAME does not match __version__ $declared" >&2; exit 1; }

  image:
    name: Build image
    needs: web-tests
    runs-on: ubuntu-latest
    # Compiling tttool from source with GHC is the slow part; the layer cache
    # below makes every build after the first one a lot quicker.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tttool-web:ci
          build-args: |
            TTTOOL_SOURCE=${{ inputs.tttool_source || 'build' }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail

          docker run -d --name tttool-web -p 8080:8080 tttool-web:ci
          trap 'docker logs tttool-web || true; docker rm -f tttool-web > /dev/null 2>&1 || true' EXIT

          echo "::group::waiting for the container to come up"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then found=yes; break; fi
            sleep 2
          done
          echo
          test "${found:-no}" = yes
          echo "::endgroup::"

          docker exec tttool-web tttool --help > /dev/null
          echo "text to speech engine:"
          docker exec tttool-web sh -c 'command -v pico2wave || command -v espeak'
          docker exec tttool-web sh -c 'command -v oggenc && command -v ffmpeg' > /dev/null

          # Build a GME file through the web API, the way a user would.
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/projects \
            --data 'name=ci&start=example'

          run() {
            curl -fsS -X POST "http://127.0.0.1:8080/p/ci/run" --data "$1"
          }

          echo "::group::assemble"
          result=$(run 'command=assemble&yaml=example.yaml&out=ci.gme')
          echo "$result"
          echo "$result" | grep -q '"ok":true'
          echo "::endgroup::"

          # oid-table exercises the PDF generator and its embedded fonts.
          echo "::group::oid-table"
          result=$(run 'command=oid-table&yaml=example.yaml&out=ci.pdf&dpi=1200&pixel_size=2&code_dim=30&image_format=pdf')
          echo "$result"
          echo "$result" | grep -q '"ok":true'
          echo "::endgroup::"

          curl -fsS -o ci.gme 'http://127.0.0.1:8080/p/ci/download?path=ci.gme'
          test -s ci.gme
          docker exec tttool-web tttool info /data/ci/ci.gme

          # The build stamp is what a beta tester reports back, so check it is there.
          echo "::group::build stamp"
          curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/health.json
          echo
          grep -q '"commit": *"[0-9a-f]\{7\}"' /tmp/health.json
          echo "::endgroup::"

          # Make a book the way the editor does: create it, put an area with a
          # sound on the page, press "make book".
          echo "::group::book editor"
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/books \
            --data 'title=CI Buch&paper=a4-landscape'
          curl -fsS -o /dev/null -X PUT http://127.0.0.1:8080/b/ci-buch/data \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI Buch","product_id":42,"paper":"a4-landscape","pages":[{"id":"s1","name":"Seite 1","image":"","areas":[{"id":"a1","name":"Hund","x":20,"y":20,"w":40,"h":30}]}]}'
          # A spoken sound exercises the synthesizer, ffmpeg and the loudness
          # filter together — the whole audio path of the image.
          spoken=$(curl -fsS -X POST http://127.0.0.1:8080/b/ci-buch/sounds/speak \
            --data-urlencode 'text=Der Hund macht wau.' --data 'language=de')
          echo "$spoken"
          echo "$spoken" | grep -q '"ok":true'
          sound_id=$(echo "$spoken" | sed -n 's/.*"sound": *"\([^"]*\)".*/\1/p')
          curl -fsS -o /dev/null -X POST \
            --data "sound_id=$sound_id" http://127.0.0.1:8080/b/ci-buch/areas/a1/sound
          result=$(curl -fsS -X POST http://127.0.0.1:8080/b/ci-buch/build)
          echo "$result"
          echo "$result" | grep -q '"ok":true'
          curl -fsS -o book.pdf 'http://127.0.0.1:8080/p/ci-buch/download?path=druck/ci-buch.pdf'
          # A page that is not exactly A4 landscape would print at the wrong
          # scale, and the codes would be unreadable — fail loudly instead.
          python3 - <<'PY'
          import re
          data = open("book.pdf", "rb").read()
          box = re.search(rb"/MediaBox\s*\[([^\]]*)\]", data)
          assert box, "no MediaBox in the PDF"
          numbers = [float(n) for n in box.group(1).split()]
          w, h = numbers[2] / 72 * 25.4, numbers[3] / 72 * 25.4
          print(f"page: {w:.1f} x {h:.1f} mm")
          assert abs(w - 297) < 1 and abs(h - 210) < 1, "wrong page size"
          PY
          docker exec tttool-web tttool info /data/ci-buch/buch.gme | grep -i 'product id'
          echo "::endgroup::"

      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name == 'push' || inputs.push
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Release tags look like web-v1.2.3; "latest" only ever moves on a
          # release, so that pulling :latest never lands on an untested build.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=match,pattern=web-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=web-v(\d+\.\d+),group=1
            type=match,pattern=web-v(\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/web-v') }}
            type=sha,format=short

      - name: Push image
        if: github.event_name == 'push' || inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TTTOOL_SOURCE=${{ inputs.tttool_source || 'build' }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_SHA=${{ github.sha }}
          # Everything is in the cache from the build step above already.
          cache-from: type=gha
